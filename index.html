<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS home screen app: full height under the status bar, own title and icon. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partner Fighter" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <title>Bitrix24 Partner Fighter</title>
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Boot safety net, before the game bundle. A phone with a stale index.html cached (Pages
      // caches it for minutes) asks for a bundle a new deploy removed: reload once, bypassing the
      // cache. Any other startup error is printed on screen instead of leaving it black.
      (function () {
        var KEY = 'bpf-boot-reload';
        function show(text) {
          var el = document.getElementById('boot-status');
          if (el) el.textContent = text;
        }
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              var reloaded = false;
              try {
                reloaded = sessionStorage.getItem(KEY) === '1';
                sessionStorage.setItem(KEY, '1');
              } catch (e) {}
              if (!reloaded) {
                location.replace(location.pathname + '?v=' + Date.now());
                return;
              }
              show('Não foi possível carregar o jogo. Recarregue a página.');
              return;
            }
            if (event.message) show('Erro ao iniciar: ' + event.message);
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          show(
            'Erro ao iniciar: ' +
              (event.reason && event.reason.message ? event.reason.message : event.reason),
          );
        });
      })();
    </script>
    <style>html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;background:#05040f;width:100%;height:100%;margin:0;padding:0;overflow:hidden}#game{width:100%;height:100%}#boot-status{color:#ffd23f;text-align:center;pointer-events:none;justify-content:center;align-items:center;padding:24px;font:900 18px/1.3 Arial Black,Impact,sans-serif;display:flex;position:fixed;inset:0}#ios-hint{top:max(10px, env(safe-area-inset-top));z-index:20;color:#fff;text-align:center;background:#0b0820eb;border:2px solid #2fe0ff;border-radius:10px;max-width:80%;padding:10px 16px;font:700 14px/1.3 Arial,sans-serif;position:fixed;left:50%;transform:translate(-50%)}#rotate-overlay{z-index:10;color:#ffd23f;text-align:center;background:#0b0820;flex-direction:column;justify-content:center;align-items:center;gap:16px;padding:24px;font:900 22px/1.3 Arial Black,Impact,sans-serif;display:none;position:fixed;inset:0}#rotate-overlay .icon{font-size:56px;animation:1.6s ease-in-out infinite rotate-hint}@keyframes rotate-hint{0%,30%{transform:rotate(0)}60%,to{transform:rotate(90deg)}}@media (orientation:portrait) and (pointer:coarse){#rotate-overlay{display:flex}}</style>
    <script type="module" crossorigin src="./assets/index-Di31eIyN.js"></script>
  </head>
  <body>
    <div id="game"></div>
    <!-- Shown until the game boots (removed in main.ts); startup errors are written here. -->
    <div id="boot-status">Carregando…</div>
    <div id="rotate-overlay" aria-live="polite">
      <div class="icon">📱</div>
      <div>Gire o dispositivo para jogar</div>
    </div>
  </body>
</html>
