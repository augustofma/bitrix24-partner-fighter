<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0820" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- iOS home screen app: full height under the status bar, own title and icon. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partner Fighter" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <title>Bitrix24 Partner Fighter</title>
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Boot safety net, before the game bundle. A phone with a stale index.html cached (Pages
      // caches it for minutes) asks for a bundle a new deploy removed: reload once, bypassing the
      // cache. Any other startup error is printed on screen instead of leaving it black.
      (function () {
        var KEY = 'bpf-boot-reload';
        function show(text) {
          var el = document.getElementById('boot-status');
          if (el) el.textContent = text;
        }
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              var reloaded = false;
              try {
                reloaded = sessionStorage.getItem(KEY) === '1';
                sessionStorage.setItem(KEY, '1');
              } catch (e) {}
              if (!reloaded) {
                location.replace(location.pathname + '?v=' + Date.now());
                return;
              }
              show('Não foi possível carregar o jogo. Recarregue a página.');
              return;
            }
            if (event.message) show('Erro ao iniciar: ' + event.message);
          },
          true,
        );
        window.addEventListener('unhandledrejection', function (event) {
          show(
            'Erro ao iniciar: ' +
              (event.reason && event.reason.message ? event.reason.message : event.reason),
          );
        });
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05040f;
        /* Prevent browser gestures (scroll, zoom, text selection) from stealing touches. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #boot-status {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #ffd23f;
        font:
          900 18px/1.3 'Arial Black',
          Impact,
          sans-serif;
        text-align: center;
        pointer-events: none;
      }

      #ios-hint {
        position: fixed;
        top: max(10px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 20;
        max-width: 80%;
        padding: 10px 16px;
        border: 2px solid #2fe0ff;
        border-radius: 10px;
        background: rgba(11, 8, 32, 0.92);
        color: #ffffff;
        font:
          700 14px/1.3 Arial,
          sans-serif;
        text-align: center;
      }

      #rotate-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #0b0820;
        color: #ffd23f;
        font:
          900 22px/1.3 'Arial Black',
          Impact,
          sans-serif;
        text-align: center;
        padding: 24px;
      }

      #rotate-overlay .icon {
        font-size: 56px;
        animation: rotate-hint 1.6s ease-in-out infinite;
      }

      @keyframes rotate-hint {
        0%,
        30% {
          transform: rotate(0deg);
        }
        60%,
        100% {
          transform: rotate(90deg);
        }
      }

      /* Touch devices in portrait: gameplay is landscape-only. */
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-overlay {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!-- Shown until the game boots (removed in main.ts); startup errors are written here. -->
    <div id="boot-status">Carregando…</div>
    <div id="rotate-overlay" aria-live="polite">
      <div class="icon">📱</div>
      <div>Gire o dispositivo para jogar</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
