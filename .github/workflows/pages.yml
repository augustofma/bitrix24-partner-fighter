# Publishes the game on GitHub Pages: on every push to main, runs the checks, builds with Vite
# and pushes the build (dist/) to the gh-pages branch, which Pages serves.
# One-time setup in the repository: Settings → Pages → "Deploy from a branch" → gh-pages / (root).
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint, format, tests and build: a broken build is never published.
      - run: npm run check
      - name: Publish dist/ to gh-pages
        run: |
          touch dist/.nojekyll
          # Keep the previous build's bundle: a phone with the old index.html still cached (Pages
          # caches it for minutes) would otherwise ask for a deleted script and show a black screen.
          if git fetch -q --depth 1 origin gh-pages; then
            for old in $(git show FETCH_HEAD:index.html | grep -o 'assets/[^"]*\.js'); do
              [ -f "dist/$old" ] || git show "FETCH_HEAD:$old" > "dist/$old"
            done
          fi
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publica o jogo (build de ${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
